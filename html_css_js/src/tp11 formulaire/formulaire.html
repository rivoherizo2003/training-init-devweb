<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Facture</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="invoice-container">
        <h1>Création d'une nouvelle facture</h1>

        <form action="#" id="form-create-bill" method="post">
            <fieldset>
                <legend>Informations Générales</legend>
                <div class="form-group">
                    <label for="invoice_num">Numéro de facture :</label>
                    <input type="text" id="invoice_num" name="invoice_num" placeholder="ex: FACT2025-001" required value="FAC0098">
                </div>
                <div class="form-group">
                    <label for="invoice_date">Date de la facture :</label>
                    <input type="date" id="invoice_date" name="invoice_date" required value="2026-12-12">
                </div>
                <div class="form-group">
                    <label for="comments">Commentaire :</label>
                    <textarea id="comments" name="comments" rows="4"
                        placeholder="Ajoutez une note ou des conditions de paiement...">Comment</textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Options de Facturation</legend>
                <div class="form-group">
                    <label>Inclure la TVA (20%) :</label>
                    <div class="radio-group">
                        <input type="radio" id="tva_yes" name="tva_option" value="yes" checked> <label
                            for="tva_yes">Oui</label>
                        <input type="radio" id="tva_no" name="tva_option" value="no"> <label for="tva_no">Non</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="client_email">Email du client :</label>
                    <input type="email" id="client_email" name="client_email" placeholder="exemple@client.com" value="exemple@client.com" required>
                </div>
                <div class="form-group">
                    <label for="amount_paid">Montant payé par le client (€) :</label>
                    <input type="number" id="amount_paid" name="amount_paid" min="0" step="0.01" placeholder="0.00" value="30000">
                </div>
                <div class="form-group">
                    <label for="payment_method">Méthode de paiement :</label>
                    <select id="payment_method" name="payment_method">
                        <option value="cc">Carte de crédit</option>
                        <option value="transfer" selected>Virement bancaire</option>
                        <option value="paypal">PayPal</option>
                        <option value="cash">Espèces</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Actions Finales</legend>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="print_invoice" name="print_invoice">
                    <label for="print_invoice">Imprimer la facture après enregistrement</label>
                </div>
            </fieldset>
            <button type="submit" style="display: none;" id="save-bill">Valider</button>
        </form>

        <h2>Détails des Produits</h2>
        <fieldset>
            <legend>Ajouter un produit</legend>

            <form action="" method="post" id="form-add-product">
                <div class="container-form-add-product">
                    <div class="form-group">
                        <label for="product-name">Nom produit</label>
                        <input type="text" name="product_name" id="product-name" value="stylos">
                    </div>
                    <div class="form-group">
                        <label for="product-quantity">Quantité</label>
                        <input type="number" name="product_quantity" id="product-quantity" value="3">
                    </div>
                    <div class="form-group">
                        <label for="product-unit-price">P.U</label>
                        <input type="number" name="product_unit_price" id="product-unit-price" value="1000">
                    </div>
                    <div class="form-group add-product-action">
                        <button type="submit" class="btn btn-primary ">Ajouter</button>
                    </div>

                </div>

            </form>

        </fieldset>
        <table id="tbl-bill-details">
            <thead>
                <tr>
                    <th>Description du Produit</th>
                    <th>Quantité</th>
                    <th>Prix Unitaire (€)</th>
                    <th>Total (€)</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total Général</td>
                    <td id="id-total">0</td>
                </tr>
            </tfoot>
        </table>

        <div class="form-actions">
            <button type="button" id="btn-save-bill" class="btn btn-primary">Enregistrer la Facture</button>
            <button type="button" id="reset-form" class="btn btn-secondary">Réinitialiser</button>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
