<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice Carte Produit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        
        <div class="product-card">
            
            <div class="product-card-image-wrapper">
                <img src="images/shoe.png" 
                     alt="Chaussure de sport rouge Nike sur fond rouge" 
                     class="product-card-image">
            </div>

            <div class="product-card-content">
                <span class="product-card-category">Sportswear</span>
                <h2 class="product-card-title">Nike Air Red Edition</h2>
                <p class="product-card-description">
                    Découvrez le confort ultime avec notre nouvelle édition limitée. 
                    Conçue pour la performance et le style au quotidien.
                </p>
                
                <div class="product-card-footer">
                    <span class="product-card-price">129.99 €</span>
                    <button class="btn btn-primary">Ajouter au panier</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
