<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    Hello units

    <div class="box-px">Je suis en 20px fixe.</div>

    <div class="container-rem">
      Je suis le parent REM (24px).
      <div class="child-rem">
        Je suis l'enfant REM (aussi 24px). Je garde la cohérence globale.
      </div>
    </div>

    <div class="container-em">
      Je suis le parent EM (24px).
      <div class="child-em">
        Je suis l'enfant EM (36px). J'ai grandi car je multiplie la taille de
        mon parent !
      </div>
    </div>

    <br />
    <div class="parent-width">
      <div class="child-percent">Largeur 50% du parent</div>
    </div>
  </body>
</html>
