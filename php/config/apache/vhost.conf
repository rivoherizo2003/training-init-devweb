<VirtualHost *:80>
    # Keep the default DocumentRoot
    DocumentRoot /var/www/html

    # Security: Deny access to the root filesystem by default
    <Directory />
        Options FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    # Configuration for your DocumentRoot
    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>

    # Specific Configuration and Rewrite Rules for the "inventor" folder
    <Directory /var/www/html/inventor>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Your rewrite rules go here natively!
        RewriteEngine On
        RewriteBase /inventor
        
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ public/index.php [QSA,L]
    </Directory>

    # Specific Configuration and Rewrite Rules for the "inventor" folder
    <Directory /var/www/html/inventor_>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Your rewrite rules go here natively!
        RewriteEngine On
        RewriteBase /inventor_
        
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ public/index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>