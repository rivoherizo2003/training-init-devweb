# ----------------------------------------------------------------------
# VIRTUALHOST 1 : inventor.test
# ----------------------------------------------------------------------
<VirtualHost *:80>
    ServerName inventor.test
    DocumentRoot /var/www/html/inventor/public

    <Directory /var/www/html/inventor/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/inventor_error.log
    CustomLog ${APACHE_LOG_DIR}/inventor_access.log combined
</VirtualHost>

