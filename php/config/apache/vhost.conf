# ----------------------------------------------------------------------
# VIRTUALHOST 3 : samples.test
# ----------------------------------------------------------------------
<VirtualHost *:80>
    ServerName samples.test
    DocumentRoot /var/www/html/samples/public

    <Directory /var/www/html/samples/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # Si le fichier ou dossier demandé n'existe pas, on route vers index.php
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/samples_error.log
    CustomLog ${APACHE_LOG_DIR}/samples_access.log combined
</VirtualHost>