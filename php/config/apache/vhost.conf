<VirtualHost *:80>
    # 1. Le DocumentRoot pointe maintenant DIRECTEMENT sur le dossier inventor
    DocumentRoot /var/www/html/inventor/public

    # Sécurité par défaut
    <Directory />
        Options FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    # 2. Configuration principale pour l'application inventor
    <Directory /var/www/html/inventor/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        
        # ⚠️ On supprime la ligne "RewriteBase /inventor" car nous sommes déjà à la racine
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # ----------------------------------------------------------------------
    # 3. GESTION DES AUTRES DOSSIERS (samples et inventor_)
    # Puisque le DocumentRoot a changé, Apache ne "voit" plus les autres dossiers.
    # On utilise la directive "Alias" pour créer des raccourcis virtuels.
    # ----------------------------------------------------------------------
    
    Alias /samples /var/www/html/samples/public
    <Directory /var/www/html/samples/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # ⚠️ On supprime la ligne "RewriteBase /samples" car nous sommes déjà à la racine
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    Alias /inventor_ /var/www/html/inventor_/public
    <Directory /var/www/html/inventor_/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # ⚠️ On supprime la ligne "RewriteBase /samples" car nous sommes déjà à la racine
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>